name: Compilar Windows
on:
  push:
    branches: [feature/pesca, feature/apuntado-y-recoleccion, feature/fix-x1-movimientoJG-recuento]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar y probar
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Slayer2Pesca-Windows
          path: dist/Slayer2Pesca.exe
          if-no-files-found: error
